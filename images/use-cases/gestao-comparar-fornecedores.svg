<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">O que sabemos antes de escolher</title><desc id="desc">Custo informado para 12 meses • sem reajustes ou descontos. A: 1.800 × 12 + 2.000. B: 2.050 × 12. C: mensalidades apenas.</desc><g font-family="Arial, Helvetica, sans-serif"><rect width="1200" height="680" rx="20" fill="#F2F5F4"/><text x="42" y="40" font-size="16" fill="#57707B" font-weight="700">G4 OS  /  EXEMPLO DE ENTREGA</text><text x="42" y="98" font-size="37" fill="#102F40" font-weight="700">O que sabemos antes de escolher</text><text x="42" y="139" font-size="21" fill="#57707B" font-weight="400">Custo informado para 12 meses • sem reajustes ou descontos</text><rect x="40" y="177" width="1120" height="400" rx="16" fill="#FFFFFF"/><rect x="40" y="177" width="1120" height="53" rx="16" fill="#102F40"/><text x="62" y="212" font-size="20" fill="#FFFFFF" font-weight="600">Proposta</text><text x="292" y="212" font-size="20" fill="#FFFFFF" font-weight="600">Custo informado</text><text x="672" y="212" font-size="20" fill="#FFFFFF" font-weight="600">O que falta esclarecer</text><rect x="48" y="239" width="1104" height="64" fill="#F1F5F4"/><text x="62" y="267" font-size="20" fill="#102F40" font-weight="400">Fornecedor A</text><text x="292" y="267" font-size="20" fill="#102F40" font-weight="400">R$ 23.600</text><text x="672" y="267" font-size="20" fill="#102F40" font-weight="400">Confirmar condições do escopo</text><text x="62" y="335" font-size="20" fill="#102F40" font-weight="400">Fornecedor B</text><text x="292" y="335" font-size="20" fill="#102F40" font-weight="400">R$ 24.600</text><text x="672" y="335" font-size="20" fill="#102F40" font-weight="400">Prazo de suporte</text><rect x="48" y="375" width="1104" height="64" fill="#F1F5F4"/><text x="62" y="403" font-size="20" fill="#102F40" font-weight="400">Fornecedor C</text><text x="292" y="403" font-size="20" fill="#102F40" font-weight="400">R$ 18.000 + itens ausentes</text><text x="672" y="403" font-size="20" fill="#102F40" font-weight="400">Implantação e parte do escopo</text><text x="44" y="631" font-size="18" fill="#57707B" font-weight="400">A: 1.800 × 12 + 2.000. B: 2.050 × 12. C: mensalidades apenas.</text></g></svg>
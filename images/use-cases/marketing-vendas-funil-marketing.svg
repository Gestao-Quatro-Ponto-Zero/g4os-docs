<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Um funil com denominadores visíveis</title><desc id="desc">Exemplo numérico independente da planilha para download. Valores fictícios ilustrativos; não são resultados calculados da planilha anexável.</desc><g font-family="Arial, Helvetica, sans-serif"><rect width="1200" height="680" rx="20" fill="#F2F5F4"/><text x="42" y="40" font-size="16" fill="#57707B" font-weight="700">G4 OS  /  EXEMPLO DE ENTREGA</text><text x="42" y="98" font-size="37" fill="#102F40" font-weight="700">Um funil com denominadores visíveis</text><text x="42" y="139" font-size="21" fill="#57707B" font-weight="400">Exemplo numérico independente da planilha para download</text><rect x="40" y="177" width="1120" height="410" rx="16" fill="#FFFFFF"/><text x="65" y="219" font-size="21" fill="#102F40" font-weight="400">Leads</text><rect x="350" y="197" width="610" height="28" rx="6" fill="#E6ECEB"/><rect x="350" y="197" width="610" height="28" rx="6" fill="#102F40"/><text x="990" y="219" font-size="22" fill="#102F40" font-weight="650">1.000</text><text x="65" y="291" font-size="21" fill="#102F40" font-weight="400">Oportunidades</text><rect x="350" y="269" width="610" height="28" rx="6" fill="#E6ECEB"/><rect x="350" y="269" width="122.0" height="28" rx="6" fill="#F0BC52"/><text x="990" y="291" font-size="22" fill="#102F40" font-weight="650">200</text><text x="65" y="363" font-size="21" fill="#102F40" font-weight="400">Fechamentos</text><rect x="350" y="341" width="610" height="28" rx="6" fill="#E6ECEB"/><rect x="350" y="341" width="30.5" height="28" rx="6" fill="#102F40"/><text x="990" y="363" font-size="22" fill="#102F40" font-weight="650">50</text><text x="66" y="557" font-size="18" fill="#57707B" font-weight="400">Leads → oportunidades: 20%. Oportunidades → fechamentos: 25%.</text><text x="44" y="631" font-size="18" fill="#57707B" font-weight="400">Valores fictícios ilustrativos; não são resultados calculados da planilha anexável.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Uma taxa só faz sentido com sua base</title><desc id="desc">Exemplo independente da planilha • oportunidades encerradas. Valores fictícios ilustrativos. Ganhos ÷ encerrados; oportunidades abertas ficam fora dessa taxa.</desc><g font-family="Arial, Helvetica, sans-serif"><rect width="1200" height="680" rx="20" fill="#F2F5F4"/><text x="42" y="40" font-size="16" fill="#57707B" font-weight="700">G4 OS  /  EXEMPLO DE ENTREGA</text><text x="42" y="98" font-size="37" fill="#102F40" font-weight="700">Uma taxa só faz sentido com sua base</text><text x="42" y="139" font-size="21" fill="#57707B" font-weight="400">Exemplo independente da planilha • oportunidades encerradas</text><rect x="40" y="177" width="1120" height="400" rx="16" fill="#FFFFFF"/><rect x="40" y="177" width="1120" height="53" rx="16" fill="#102F40"/><text x="62" y="212" font-size="20" fill="#FFFFFF" font-weight="600">Equipe</text><text x="382" y="212" font-size="20" fill="#FFFFFF" font-weight="600">Ganhos / encerrados</text><text x="862" y="212" font-size="20" fill="#FFFFFF" font-weight="600">Conversão</text><rect x="48" y="239" width="1104" height="64" fill="#F1F5F4"/><text x="62" y="267" font-size="20" fill="#102F40" font-weight="400">Equipe A</text><text x="382" y="267" font-size="20" fill="#102F40" font-weight="400">20 / 100</text><text x="862" y="267" font-size="20" fill="#102F40" font-weight="400">20%</text><text x="62" y="335" font-size="20" fill="#102F40" font-weight="400">Equipe B</text><text x="382" y="335" font-size="20" fill="#102F40" font-weight="400">30 / 100</text><text x="862" y="335" font-size="20" fill="#102F40" font-weight="400">30%</text><rect x="48" y="375" width="1104" height="64" fill="#F1F5F4"/><text x="62" y="403" font-size="20" fill="#102F40" font-weight="400">Em aberto</text><text x="382" y="403" font-size="20" fill="#102F40" font-weight="400">Separados da base</text><text x="862" y="403" font-size="20" fill="#102F40" font-weight="400">Acompanhar depois</text><text x="44" y="631" font-size="18" fill="#57707B" font-weight="400">Valores fictícios ilustrativos. Ganhos ÷ encerrados; oportunidades abertas ficam fora dessa taxa.</text></g></svg>
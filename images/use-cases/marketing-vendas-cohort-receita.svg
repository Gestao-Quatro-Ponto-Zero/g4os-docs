<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Compare grupos no mesmo mês de vida</title><desc id="desc">Receita relativa ilustrativa • cada grupo começa em 100%. Percentuais fictícios ilustrativos; não são resultados calculados da planilha anexável.</desc><g font-family="Arial, Helvetica, sans-serif"><rect width="1200" height="680" rx="20" fill="#F2F5F4"/><text x="42" y="40" font-size="16" fill="#57707B" font-weight="700">G4 OS  /  EXEMPLO DE ENTREGA</text><text x="42" y="98" font-size="37" fill="#102F40" font-weight="700">Compare grupos no mesmo mês de vida</text><text x="42" y="139" font-size="21" fill="#57707B" font-weight="400">Receita relativa ilustrativa • cada grupo começa em 100%</text><rect x="40" y="177" width="1120" height="400" rx="16" fill="#FFFFFF"/><rect x="40" y="177" width="1120" height="53" rx="16" fill="#102F40"/><text x="62" y="212" font-size="20" fill="#FFFFFF" font-weight="600">Grupo de entrada</text><text x="442" y="212" font-size="20" fill="#FFFFFF" font-weight="600">Mês 0</text><text x="642" y="212" font-size="20" fill="#FFFFFF" font-weight="600">Mês 1</text><text x="842" y="212" font-size="20" fill="#FFFFFF" font-weight="600">Mês 3</text><rect x="48" y="239" width="1104" height="64" fill="#F1F5F4"/><text x="62" y="267" font-size="20" fill="#102F40" font-weight="400">Grupo A</text><text x="442" y="267" font-size="20" fill="#102F40" font-weight="400">100%</text><text x="642" y="267" font-size="20" fill="#102F40" font-weight="400">90%</text><text x="842" y="267" font-size="20" fill="#102F40" font-weight="400">80%</text><text x="62" y="335" font-size="20" fill="#102F40" font-weight="400">Grupo B</text><text x="442" y="335" font-size="20" fill="#102F40" font-weight="400">100%</text><text x="642" y="335" font-size="20" fill="#102F40" font-weight="400">95%</text><text x="842" y="335" font-size="20" fill="#102F40" font-weight="400">85%</text><rect x="48" y="375" width="1104" height="64" fill="#F1F5F4"/><text x="62" y="403" font-size="20" fill="#102F40" font-weight="400">Grupo C</text><text x="442" y="403" font-size="20" fill="#102F40" font-weight="400">100%</text><text x="642" y="403" font-size="20" fill="#102F40" font-weight="400">92%</text><text x="842" y="403" font-size="20" fill="#102F40" font-weight="400">Ainda não observado</text><text x="44" y="631" font-size="18" fill="#57707B" font-weight="400">Percentuais fictícios ilustrativos; não são resultados calculados da planilha anexável.</text></g></svg>
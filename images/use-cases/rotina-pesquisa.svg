<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Compare abordagens com os mesmos critérios</title><desc id="desc">Estrutura ilustrativa • conclusões dependem das fontes. Exemplo ilustrativo. Confira os fatos e as referências antes de usar.</desc><g font-family="Arial, Helvetica, sans-serif"><rect width="1200" height="680" rx="20" fill="#F2F5F4"/><text x="42" y="40" font-size="16" fill="#57707B" font-weight="700">G4 OS  /  EXEMPLO DE ENTREGA</text><text x="42" y="98" font-size="37" fill="#102F40" font-weight="700">Compare abordagens com os mesmos critérios</text><text x="42" y="139" font-size="21" fill="#57707B" font-weight="400">Estrutura ilustrativa • conclusões dependem das fontes</text><rect x="40" y="177" width="1120" height="400" rx="16" fill="#FFFFFF"/><rect x="40" y="177" width="1120" height="53" rx="16" fill="#102F40"/><text x="62" y="212" font-size="20" fill="#FFFFFF" font-weight="600">Abordagem</text><text x="442" y="212" font-size="20" fill="#FFFFFF" font-weight="600">Esforço inicial</text><text x="732" y="212" font-size="20" fill="#FFFFFF" font-weight="600">Ponto a investigar</text><rect x="48" y="239" width="1104" height="64" fill="#F1F5F4"/><text x="62" y="267" font-size="20" fill="#102F40" font-weight="400">Caixa compartilhada</text><text x="442" y="267" font-size="20" fill="#102F40" font-weight="400">Configurar triagem</text><text x="732" y="267" font-size="20" fill="#102F40" font-weight="400">Quem assume cada pedido?</text><text x="62" y="335" font-size="20" fill="#102F40" font-weight="400">Formulário e fila</text><text x="442" y="335" font-size="20" fill="#102F40" font-weight="400">Definir campos e etapas</text><text x="732" y="335" font-size="20" fill="#102F40" font-weight="400">Como tratar urgências?</text><rect x="48" y="375" width="1104" height="64" fill="#F1F5F4"/><text x="62" y="403" font-size="20" fill="#102F40" font-weight="400">Central de atendimento</text><text x="442" y="403" font-size="20" fill="#102F40" font-weight="400">Organizar categorias</text><text x="732" y="403" font-size="20" fill="#102F40" font-weight="400">Qual manutenção cabe à equipe?</text><text x="44" y="631" font-size="18" fill="#57707B" font-weight="400">Exemplo ilustrativo. Confira os fatos e as referências antes de usar.</text></g></svg>
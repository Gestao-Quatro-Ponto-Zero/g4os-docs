<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Cinco slides para uma decisão</title><desc id="desc">Roteiro ilustrativo • apresentação executiva de 10 minutos. Exemplo ilustrativo. Confira os fatos e as referências antes de usar.</desc><g font-family="Arial, Helvetica, sans-serif"><rect width="1200" height="680" rx="20" fill="#F2F5F4"/><text x="42" y="40" font-size="16" fill="#57707B" font-weight="700">G4 OS  /  EXEMPLO DE ENTREGA</text><text x="42" y="98" font-size="37" fill="#102F40" font-weight="700">Cinco slides para uma decisão</text><text x="42" y="139" font-size="21" fill="#57707B" font-weight="400">Roteiro ilustrativo • apresentação executiva de 10 minutos</text><rect x="40" y="177" width="550" height="183" rx="16" fill="#FFFFFF"/><text x="65" y="212" font-size="16" fill="#57707B" font-weight="700">01 · OBJETIVO</text><text x="65" y="254" font-size="28" fill="#102F40" font-weight="650">Qual decisão precisamos tomar?</text><text x="65" y="292" font-size="20" fill="#102F40" font-weight="400">Abra com o resultado esperado da</text><text x="65" y="322" font-size="20" fill="#102F40" font-weight="400">reunião.</text><rect x="610" y="177" width="550" height="183" rx="16" fill="#FFFFFF"/><text x="635" y="212" font-size="16" fill="#57707B" font-weight="700">02 · SITUAÇÃO</text><text x="635" y="254" font-size="28" fill="#102F40" font-weight="650">O que sabemos hoje?</text><text x="635" y="292" font-size="20" fill="#102F40" font-weight="400">Use fatos e marque lacunas como</text><text x="635" y="322" font-size="20" fill="#102F40" font-weight="400">pendentes.</text><rect x="40" y="377" width="550" height="183" rx="16" fill="#FFFFFF"/><text x="65" y="412" font-size="16" fill="#57707B" font-weight="700">03 E 04 · OPÇÕES</text><text x="65" y="454" font-size="28" fill="#102F40" font-weight="650">Compare e recomende</text><text x="65" y="492" font-size="20" fill="#102F40" font-weight="400">Mostre critérios e evidências da</text><text x="65" y="522" font-size="20" fill="#102F40" font-weight="400">proposta.</text><rect x="610" y="377" width="550" height="183" rx="16" fill="#FFFFFF"/><text x="635" y="412" font-size="16" fill="#57707B" font-weight="700">05 · DECISÃO</text><text x="635" y="454" font-size="28" fill="#102F40" font-weight="650">O que precisa ser aprovado?</text><text x="635" y="492" font-size="20" fill="#102F40" font-weight="400">Deixe a pergunta final clara e</text><text x="635" y="522" font-size="20" fill="#102F40" font-weight="400">específica.</text><text x="44" y="631" font-size="18" fill="#57707B" font-weight="400">Exemplo ilustrativo. Confira os fatos e as referências antes de usar.</text></g></svg>
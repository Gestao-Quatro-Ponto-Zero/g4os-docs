<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Da caixa de entrada à próxima ação</title><desc id="desc">Recorte fictício • três conversas para revisar. Exemplo ilustrativo. Confira os fatos e as referências antes de usar.</desc><g font-family="Arial, Helvetica, sans-serif"><rect width="1200" height="680" rx="20" fill="#F2F5F4"/><text x="42" y="40" font-size="16" fill="#57707B" font-weight="700">G4 OS  /  EXEMPLO DE ENTREGA</text><text x="42" y="98" font-size="37" fill="#102F40" font-weight="700">Da caixa de entrada à próxima ação</text><text x="42" y="139" font-size="21" fill="#57707B" font-weight="400">Recorte fictício • três conversas para revisar</text><rect x="40" y="177" width="1120" height="400" rx="16" fill="#FFFFFF"/><rect x="40" y="177" width="1120" height="53" rx="16" fill="#102F40"/><text x="62" y="212" font-size="20" fill="#FFFFFF" font-weight="600">Ação</text><text x="282" y="212" font-size="20" fill="#FFFFFF" font-weight="600">Conversa</text><text x="702" y="212" font-size="20" fill="#FFFFFF" font-weight="600">Próximo passo</text><rect x="48" y="239" width="1104" height="64" fill="#F1F5F4"/><text x="62" y="267" font-size="20" fill="#102F40" font-weight="400">Responder</text><text x="282" y="267" font-size="20" fill="#102F40" font-weight="400">Demonstração do projeto</text><text x="702" y="267" font-size="20" fill="#102F40" font-weight="400">Confirmar participantes</text><text x="62" y="335" font-size="20" fill="#102F40" font-weight="400">Decidir</text><text x="282" y="335" font-size="20" fill="#102F40" font-weight="400">Prioridade da semana</text><text x="702" y="335" font-size="20" fill="#102F40" font-weight="400">Escolher a entrega principal</text><rect x="48" y="375" width="1104" height="64" fill="#F1F5F4"/><text x="62" y="403" font-size="20" fill="#102F40" font-weight="400">Acompanhar</text><text x="282" y="403" font-size="20" fill="#102F40" font-weight="400">Atualização do piloto</text><text x="702" y="403" font-size="20" fill="#102F40" font-weight="400">Sem resposta necessária</text><text x="44" y="631" font-size="18" fill="#57707B" font-weight="400">Exemplo ilustrativo. Confira os fatos e as referências antes de usar.</text></g></svg>
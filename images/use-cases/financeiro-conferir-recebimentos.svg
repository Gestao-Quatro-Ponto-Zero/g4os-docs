<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Uma diferença de R$ 20 para investigar</title><desc id="desc">Duas bases do exercício • correspondência pela referência. Resultados do exercício. Ausência de correspondência não prova falta de pagamento.</desc><g font-family="Arial, Helvetica, sans-serif"><rect width="1200" height="680" rx="20" fill="#F2F5F4"/><text x="42" y="40" font-size="16" fill="#57707B" font-weight="700">G4 OS  /  EXEMPLO DE ENTREGA</text><text x="42" y="98" font-size="37" fill="#102F40" font-weight="700">Uma diferença de R$ 20 para investigar</text><text x="42" y="139" font-size="21" fill="#57707B" font-weight="400">Duas bases do exercício • correspondência pela referência</text><rect x="40" y="177" width="1120" height="400" rx="16" fill="#FFFFFF"/><rect x="40" y="177" width="1120" height="53" rx="16" fill="#102F40"/><text x="62" y="212" font-size="20" fill="#FFFFFF" font-weight="600">Referência</text><text x="322" y="212" font-size="20" fill="#FFFFFF" font-weight="600">Conferência</text><text x="782" y="212" font-size="20" fill="#FFFFFF" font-weight="600">Situação</text><rect x="48" y="239" width="1104" height="64" fill="#F1F5F4"/><text x="62" y="267" font-size="20" fill="#102F40" font-weight="400">REC001 / REC003</text><text x="322" y="267" font-size="20" fill="#102F40" font-weight="400">Valores coincidem</text><text x="782" y="267" font-size="20" fill="#102F40" font-weight="400">Correspondências encontradas</text><text x="62" y="335" font-size="20" fill="#102F40" font-weight="400">REC002</text><text x="322" y="335" font-size="20" fill="#102F40" font-weight="400">R$ 750 previsto / R$ 730 recebido</text><text x="782" y="335" font-size="20" fill="#102F40" font-weight="400">Causa da diferença não</text><text x="782" y="365" font-size="20" fill="#102F40" font-weight="400">informada</text><rect x="48" y="375" width="1104" height="64" fill="#F1F5F4"/><text x="62" y="403" font-size="20" fill="#102F40" font-weight="400">REC004 / REC005</text><text x="322" y="403" font-size="20" fill="#102F40" font-weight="400">Sem recebimento correspondente</text><text x="782" y="403" font-size="20" fill="#102F40" font-weight="400">Conferir período e origem</text><text x="62" y="471" font-size="20" fill="#102F40" font-weight="400">REC006</text><text x="322" y="471" font-size="20" fill="#102F40" font-weight="400">R$ 300 sem previsão correspondente</text><text x="782" y="471" font-size="20" fill="#102F40" font-weight="400">Identificar origem</text><text x="44" y="631" font-size="18" fill="#57707B" font-weight="400">Resultados do exercício. Ausência de correspondência não prova falta de pagamento.</text></g></svg>
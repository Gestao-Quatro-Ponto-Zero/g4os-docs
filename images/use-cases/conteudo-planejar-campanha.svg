<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Uma mensagem, três formatos</title><desc id="desc">Workshop fictício sobre organização de reuniões. Exemplo ilustrativo. Confira os fatos e as referências antes de usar.</desc><g font-family="Arial, Helvetica, sans-serif"><rect width="1200" height="680" rx="20" fill="#F2F5F4"/><text x="42" y="40" font-size="16" fill="#57707B" font-weight="700">G4 OS  /  EXEMPLO DE ENTREGA</text><text x="42" y="98" font-size="37" fill="#102F40" font-weight="700">Uma mensagem, três formatos</text><text x="42" y="139" font-size="21" fill="#57707B" font-weight="400">Workshop fictício sobre organização de reuniões</text><rect x="40" y="177" width="550" height="183" rx="16" fill="#FFFFFF"/><text x="65" y="212" font-size="16" fill="#57707B" font-weight="700">MENSAGEM CENTRAL</text><text x="65" y="254" font-size="28" fill="#102F40" font-weight="650">Reuniões com objetivo</text><text x="65" y="292" font-size="20" fill="#102F40" font-weight="400">Cada bloco precisa de um resultado</text><text x="65" y="322" font-size="20" fill="#102F40" font-weight="400">esperado.</text><rect x="610" y="177" width="550" height="183" rx="16" fill="#FFFFFF"/><text x="635" y="212" font-size="16" fill="#57707B" font-weight="700">PUBLICAÇÃO</text><text x="635" y="254" font-size="28" fill="#102F40" font-weight="650">Uma sugestão prática</text><text x="635" y="292" font-size="20" fill="#102F40" font-weight="400">Comece pela decisão que a reunião</text><text x="635" y="322" font-size="20" fill="#102F40" font-weight="400">precisa produzir.</text><rect x="40" y="377" width="550" height="183" rx="16" fill="#FFFFFF"/><text x="65" y="412" font-size="16" fill="#57707B" font-weight="700">VÍDEO · 45 SEGUNDOS</text><text x="65" y="454" font-size="28" fill="#102F40" font-weight="650">Problema → exemplo → convite</text><text x="65" y="492" font-size="20" fill="#102F40" font-weight="400">Mostre uma pauta curta e um fechamento</text><text x="65" y="522" font-size="20" fill="#102F40" font-weight="400">claro.</text><rect x="610" y="377" width="550" height="183" rx="16" fill="#FFFFFF"/><text x="635" y="412" font-size="16" fill="#57707B" font-weight="700">E-MAIL</text><text x="635" y="454" font-size="28" fill="#102F40" font-weight="650">Apresente o tema</text><text x="635" y="492" font-size="20" fill="#102F40" font-weight="400">Data, preço e link continuam pendentes.</text><text x="44" y="631" font-size="18" fill="#57707B" font-weight="400">Exemplo ilustrativo. Confira os fatos e as referências antes de usar.</text></g></svg>
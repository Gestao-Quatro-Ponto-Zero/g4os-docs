<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Cliente Horizonte: contexto em uma página</title><desc id="desc">Briefing fictício • piloto concluído e demonstração pendente. Exemplo ilustrativo. Confira os fatos e as referências antes de usar.</desc><g font-family="Arial, Helvetica, sans-serif"><rect width="1200" height="680" rx="20" fill="#F2F5F4"/><text x="42" y="40" font-size="16" fill="#57707B" font-weight="700">G4 OS  /  EXEMPLO DE ENTREGA</text><text x="42" y="98" font-size="37" fill="#102F40" font-weight="700">Cliente Horizonte: contexto em uma página</text><text x="42" y="139" font-size="21" fill="#57707B" font-weight="400">Briefing fictício • piloto concluído e demonstração pendente</text><rect x="40" y="177" width="550" height="183" rx="16" fill="#FFFFFF"/><text x="65" y="212" font-size="16" fill="#57707B" font-weight="700">CONFIRMADO</text><text x="65" y="254" font-size="28" fill="#102F40" font-weight="650">Piloto concluído</text><text x="65" y="292" font-size="20" fill="#102F40" font-weight="400">O cliente pediu demonstração para outra</text><text x="65" y="322" font-size="20" fill="#102F40" font-weight="400">equipe.</text><rect x="610" y="177" width="550" height="183" rx="16" fill="#FFFFFF"/><text x="635" y="212" font-size="16" fill="#57707B" font-weight="700">PENDENTE</text><text x="635" y="254" font-size="28" fill="#102F40" font-weight="650">Data e participantes</text><text x="635" y="292" font-size="20" fill="#102F40" font-weight="400">Ainda precisam ser combinados.</text><rect x="40" y="377" width="550" height="183" rx="16" fill="#FFFFFF"/><text x="65" y="412" font-size="16" fill="#57707B" font-weight="700">PERGUNTAS</text><text x="65" y="454" font-size="28" fill="#102F40" font-weight="650">O que a nova equipe precisa?</text><text x="65" y="492" font-size="20" fill="#102F40" font-weight="400">Confirmar objetivo e expectativa da</text><text x="65" y="522" font-size="20" fill="#102F40" font-weight="400">demonstração.</text><rect x="610" y="377" width="550" height="183" rx="16" fill="#FFFFFF"/><text x="635" y="412" font-size="16" fill="#57707B" font-weight="700">PAUTA · 30 MIN</text><text x="635" y="454" font-size="28" fill="#102F40" font-weight="650">Revisar, demonstrar, combinar</text><text x="635" y="492" font-size="20" fill="#102F40" font-weight="400">Fechar próximos passos sem inventar</text><text x="635" y="522" font-size="20" fill="#102F40" font-weight="400">compromissos.</text><text x="44" y="631" font-size="18" fill="#57707B" font-weight="400">Exemplo ilustrativo. Confira os fatos e as referências antes de usar.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Mudanças que merecem uma decisão</title><desc id="desc">Exemplo de comparação • versões e seções identificadas. Exemplo ilustrativo. Confira os fatos e as referências antes de usar.</desc><g font-family="Arial, Helvetica, sans-serif"><rect width="1200" height="680" rx="20" fill="#F2F5F4"/><text x="42" y="40" font-size="16" fill="#57707B" font-weight="700">G4 OS  /  EXEMPLO DE ENTREGA</text><text x="42" y="98" font-size="37" fill="#102F40" font-weight="700">Mudanças que merecem uma decisão</text><text x="42" y="139" font-size="21" fill="#57707B" font-weight="400">Exemplo de comparação • versões e seções identificadas</text><rect x="40" y="177" width="1120" height="400" rx="16" fill="#FFFFFF"/><rect x="40" y="177" width="1120" height="53" rx="16" fill="#102F40"/><text x="62" y="212" font-size="20" fill="#FFFFFF" font-weight="600">Referência</text><text x="362" y="212" font-size="20" fill="#FFFFFF" font-weight="600">Versão anterior</text><text x="762" y="212" font-size="20" fill="#FFFFFF" font-weight="600">Proposta</text><rect x="48" y="239" width="1104" height="64" fill="#F1F5F4"/><text x="62" y="267" font-size="20" fill="#102F40" font-weight="400">Seção 2 · escopo</text><text x="362" y="267" font-size="20" fill="#102F40" font-weight="400">Uma rodada de revisão</text><text x="762" y="267" font-size="20" fill="#102F40" font-weight="400">Duas rodadas de revisão</text><text x="62" y="335" font-size="20" fill="#102F40" font-weight="400">Seção 4 · prazo</text><text x="362" y="335" font-size="20" fill="#102F40" font-weight="400">Entrega em 10 dias</text><text x="762" y="335" font-size="20" fill="#102F40" font-weight="400">Entrega em 15 dias</text><rect x="48" y="375" width="1104" height="64" fill="#F1F5F4"/><text x="62" y="403" font-size="20" fill="#102F40" font-weight="400">Seção 6 · responsável</text><text x="362" y="403" font-size="20" fill="#102F40" font-weight="400">Pessoa A</text><text x="762" y="403" font-size="20" fill="#102F40" font-weight="400">Pessoa B</text><text x="62" y="471" font-size="20" fill="#102F40" font-weight="400">Revisão necessária</text><text x="362" y="471" font-size="20" fill="#102F40" font-weight="400">Mudanças de compromisso</text><text x="762" y="471" font-size="20" fill="#102F40" font-weight="400">Confirmar com responsável</text><text x="44" y="631" font-size="18" fill="#57707B" font-weight="400">Exemplo ilustrativo. Confira os fatos e as referências antes de usar.</text></g></svg>
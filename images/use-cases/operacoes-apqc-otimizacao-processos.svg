<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Do pedido ao encerramento</title><desc id="desc">Fluxo ilustrativo • validar com quem executa o processo. Exemplo ilustrativo. Confira os fatos e as referências antes de usar.</desc><g font-family="Arial, Helvetica, sans-serif"><rect width="1200" height="680" rx="20" fill="#F2F5F4"/><text x="42" y="40" font-size="16" fill="#57707B" font-weight="700">G4 OS  /  EXEMPLO DE ENTREGA</text><text x="42" y="98" font-size="37" fill="#102F40" font-weight="700">Do pedido ao encerramento</text><text x="42" y="139" font-size="21" fill="#57707B" font-weight="400">Fluxo ilustrativo • validar com quem executa o processo</text><rect x="40" y="177" width="1120" height="410" rx="16" fill="#FFFFFF"/><circle cx="84" cy="227" r="22" fill="#F0BC52"/><text x="76" y="235" font-size="22" fill="#102F40" font-weight="700">1</text><text x="126" y="221" font-size="18" fill="#57707B" font-weight="600">Início</text><text x="245" y="221" font-size="24" fill="#102F40" font-weight="650">Receber a solicitação</text><text x="245" y="252" font-size="20" fill="#57707B" font-weight="400">Registrar objetivo e dados necessários.</text><circle cx="84" cy="317" r="22" fill="#F0BC52"/><text x="76" y="325" font-size="22" fill="#102F40" font-weight="700">2</text><text x="126" y="311" font-size="18" fill="#57707B" font-weight="600">Triagem</text><text x="245" y="311" font-size="24" fill="#102F40" font-weight="650">Classificar e atribuir</text><text x="245" y="342" font-size="20" fill="#57707B" font-weight="400">Definir responsável e identificar exceções.</text><circle cx="84" cy="407" r="22" fill="#F0BC52"/><text x="76" y="415" font-size="22" fill="#102F40" font-weight="700">3</text><text x="126" y="401" font-size="18" fill="#57707B" font-weight="600">Execução</text><text x="245" y="401" font-size="24" fill="#102F40" font-weight="650">Atender e registrar</text><text x="245" y="432" font-size="20" fill="#57707B" font-weight="400">Documentar ação e impedimentos.</text><circle cx="84" cy="497" r="22" fill="#F0BC52"/><text x="76" y="505" font-size="22" fill="#102F40" font-weight="700">4</text><text x="126" y="491" font-size="18" fill="#57707B" font-weight="600">Fim</text><text x="245" y="491" font-size="24" fill="#102F40" font-weight="650">Confirmar o resultado</text><text x="245" y="522" font-size="20" fill="#57707B" font-weight="400">Validar atendimento e atualizar o registro.</text><text x="44" y="631" font-size="18" fill="#57707B" font-weight="400">Exemplo ilustrativo. Confira os fatos e as referências antes de usar.</text></g></svg>
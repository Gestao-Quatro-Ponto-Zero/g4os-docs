<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Uma revisão que separa evidência de dúvida</title><desc id="desc">Exemplo de relatório • ambiente de teste autorizado. Exemplo ilustrativo. Confira os fatos e as referências antes de usar.</desc><g font-family="Arial, Helvetica, sans-serif"><rect width="1200" height="680" rx="20" fill="#F2F5F4"/><text x="42" y="40" font-size="16" fill="#57707B" font-weight="700">G4 OS  /  EXEMPLO DE ENTREGA</text><text x="42" y="98" font-size="37" fill="#102F40" font-weight="700">Uma revisão que separa evidência de dúvida</text><text x="42" y="139" font-size="21" fill="#57707B" font-weight="400">Exemplo de relatório • ambiente de teste autorizado</text><rect x="40" y="177" width="1120" height="400" rx="16" fill="#FFFFFF"/><rect x="40" y="177" width="1120" height="53" rx="16" fill="#102F40"/><text x="62" y="212" font-size="20" fill="#FFFFFF" font-weight="600">Jornada</text><text x="322" y="212" font-size="20" fill="#FFFFFF" font-weight="600">Observação ilustrativa</text><text x="802" y="212" font-size="20" fill="#FFFFFF" font-weight="600">Encaminhamento</text><rect x="48" y="239" width="1104" height="64" fill="#F1F5F4"/><text x="62" y="267" font-size="20" fill="#102F40" font-weight="400">Entrar</text><text x="322" y="267" font-size="20" fill="#102F40" font-weight="400">Mensagem de erro pouco clara</text><text x="802" y="267" font-size="20" fill="#102F40" font-weight="400">Revisar o texto</text><text x="62" y="335" font-size="20" fill="#102F40" font-weight="400">Preencher formulário</text><text x="322" y="335" font-size="20" fill="#102F40" font-weight="400">Campo obrigatório sem indicação</text><text x="802" y="335" font-size="20" fill="#102F40" font-weight="400">Ajustar identificação visual</text><rect x="48" y="375" width="1104" height="64" fill="#F1F5F4"/><text x="62" y="403" font-size="20" fill="#102F40" font-weight="400">Consultar dados</text><text x="322" y="403" font-size="20" fill="#102F40" font-weight="400">Isolamento entre contas não testado</text><text x="802" y="403" font-size="20" fill="#102F40" font-weight="400">Encaminhar à equipe técnica</text><text x="62" y="471" font-size="20" fill="#102F40" font-weight="400">Concluir</text><text x="322" y="471" font-size="20" fill="#102F40" font-weight="400">Revisão funcional parcial</text><text x="802" y="471" font-size="20" fill="#102F40" font-weight="400">Não declarar segurança</text><text x="802" y="501" font-size="20" fill="#102F40" font-weight="400">comprovada</text><text x="44" y="631" font-size="18" fill="#57707B" font-weight="400">Exemplo ilustrativo. Confira os fatos e as referências antes de usar.</text></g></svg>
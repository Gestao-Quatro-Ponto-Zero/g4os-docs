<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">O que avançou e o que precisa de decisão</title><desc id="desc">Modelo de resumo • preencher com a base da semana. Exemplo ilustrativo. Confira os fatos e as referências antes de usar.</desc><g font-family="Arial, Helvetica, sans-serif"><rect width="1200" height="680" rx="20" fill="#F2F5F4"/><text x="42" y="40" font-size="16" fill="#57707B" font-weight="700">G4 OS  /  EXEMPLO DE ENTREGA</text><text x="42" y="98" font-size="37" fill="#102F40" font-weight="700">O que avançou e o que precisa de decisão</text><text x="42" y="139" font-size="21" fill="#57707B" font-weight="400">Modelo de resumo • preencher com a base da semana</text><rect x="40" y="177" width="550" height="183" rx="16" fill="#FFFFFF"/><text x="65" y="212" font-size="16" fill="#57707B" font-weight="700">ENTREGAS</text><text x="65" y="254" font-size="28" fill="#102F40" font-weight="650">O que terminou</text><text x="65" y="292" font-size="20" fill="#102F40" font-weight="400">Liste entregas confirmadas e</text><text x="65" y="322" font-size="20" fill="#102F40" font-weight="400">referências.</text><rect x="610" y="177" width="550" height="183" rx="16" fill="#FFFFFF"/><text x="635" y="212" font-size="16" fill="#57707B" font-weight="700">EM ANDAMENTO</text><text x="635" y="254" font-size="28" fill="#102F40" font-weight="650">O que segue aberto</text><text x="635" y="292" font-size="20" fill="#102F40" font-weight="400">Indique responsável e próximo marco.</text><rect x="40" y="377" width="550" height="183" rx="16" fill="#FFFFFF"/><text x="65" y="412" font-size="16" fill="#57707B" font-weight="700">BLOQUEIOS</text><text x="65" y="454" font-size="28" fill="#102F40" font-weight="650">Onde falta apoio</text><text x="65" y="492" font-size="20" fill="#102F40" font-weight="400">Separe dependência externa de atraso.</text><rect x="610" y="377" width="550" height="183" rx="16" fill="#FFFFFF"/><text x="635" y="412" font-size="16" fill="#57707B" font-weight="700">DECISÕES</text><text x="635" y="454" font-size="28" fill="#102F40" font-weight="650">O que a liderança resolve</text><text x="635" y="492" font-size="20" fill="#102F40" font-weight="400">Formule a pergunta e indique o impacto.</text><text x="44" y="631" font-size="18" fill="#57707B" font-weight="400">Exemplo ilustrativo. Confira os fatos e as referências antes de usar.</text></g></svg>